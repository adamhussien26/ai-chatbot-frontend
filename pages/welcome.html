<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد الذكي - جامعة العلوم والتقانة</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- JS -->
  <script src="../js/main.js" defer></script>
</head>
<body class="welcome-page">

  <!-- App Header / Topbar -->
  <header>
    <div class="brand">
      <div class="brand-text">
        <div class="title">المساعد الذكي</div>
        <div class="subtitle">جامعة العلوم والتقانة</div>
      </div>
      <div class="brand-logo">
        <img src="../assets/images/logo.png" alt="شعار الجامعة">
      </div>
    </div>
  </header>

  <!-- Hero Content Area -->
  <main>
    <!-- Character (static) -->
    <div class="hero-character" aria-hidden="true">
      <div class="char-ground"></div>
      <img class="character-img" src="../assets/images/adam.png" alt="مساعدك الذكي لخدمات الجامعة">
    </div>

    <h1>مرحبًا بك <span></span></h1>
    <h2>أنا مساعدك الذكي لخدمات الجامعة</h2>

    <p class="hero-question">كيف يمكنني مساعدتك اليوم؟</p>

    <p class="desc">
      اسأل عن جدولك، نتائجك، التسجيل، الرسوم، أو أي معلومة جامعية — وستجد الإجابة فورًا.
    </p>

    <a href="login.html" class="login-btn" id="loginBtn">
      <span>تسجيل الدخول</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
    </a>

  </main>

</body>
</html>
