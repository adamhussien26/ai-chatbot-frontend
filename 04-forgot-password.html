<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسيت كلمة المرور - جامعة العلوم والتقانة</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/pages/forgot-password.css">
  <!-- Dribbble Theme (Remove or comment this line to revert to original baseline) -->
  <link rel="stylesheet" href="css/dribbble-theme.css">

  <!-- JS Scripts -->
  <script src="js/main.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/pages/forgot-password.js" defer></script>
</head>
<body>

<div class="card">

  <div class="brand-logo">
    <img src="assets/logo.png" alt="شعار الجامعة">
  </div>

  <!-- Request Form -->
  <div class="form-box" id="formBox">
    <h1>نسيت كلمة المرور؟</h1>
    <p class="desc">لا مشكلة، أدخل بريدك الإلكتروني الجامعي وسنرسل لك رابط إعادة تعيين كلمة المرور.</p>

    <form id="resetForm" novalidate>
      <div class="field" id="emailField">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" autocomplete="email">
        <div class="error">من فضلك أدخل بريدًا إلكترونيًا صحيحًا.</div>
      </div>

      <button type="submit" class="btn-primary reset-send-btn" id="submitBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="send-icon" aria-hidden="true">
          <path d="M22 2L11 13"></path>
          <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
        </svg>
        <span id="submitText">إرسال رابط إعادة التعيين</span>
      </button>
    </form>

    <a href="03-login.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>العودة إلى تسجيل الدخول</span>
    </a>
  </div>

  <!-- Success View State -->
  <div class="success-box" id="successBox">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <h2>تحقق من بريدك الإلكتروني</h2>
    <p>أرسلنا رابط إعادة تعيين كلمة المرور إلى<br><span class="email-highlight" id="sentEmail"></span></p>

    <p class="resend">
      لم يصلك البريد؟ <button type="button" id="resendBtn">إعادة الإرسال</button>
    </p>

    <br>
    <a href="03-login.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>العودة إلى تسجيل الدخول</span>
    </a>
  </div>

</div>

</body>
</html>
