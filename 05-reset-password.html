<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور - جامعة العلوم والتقانة</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/pages/reset-password.css">

  <!-- JS Scripts -->
  <script src="js/main.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/pages/reset-password.js" defer></script>
</head>
<body>

<div class="card">

  <div class="brand-logo">
    <img src="assets/logo.png" alt="شعار الجامعة">
  </div>

  <!-- Reset Form -->
  <div class="form-box" id="formBox">
    <h1>إعادة تعيين كلمة المرور</h1>
    <p class="desc">أدخل كلمة مرور جديدة وقوية لحسابك الجامعي.</p>

    <form id="resetForm" novalidate>
      <div class="field" id="passField">
        <label for="password">كلمة المرور الجديدة</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="أدخل كلمة المرور الجديدة" autocomplete="new-password">
          <span class="toggle-pass" data-target="password" role="button" aria-label="تبديل إظهار كلمة المرور">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>
        <div class="strength" aria-label="مقياس قوة كلمة المرور">
          <div class="bar" id="bar1"></div>
          <div class="bar" id="bar2"></div>
          <div class="bar" id="bar3"></div>
          <div class="bar" id="bar4"></div>
        </div>
        <div class="strength-label" id="strengthLabel">&nbsp;</div>
      </div>

      <ul class="rules">
        <li id="rule-length"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg> 8 أحرف على الأقل</li>
        <li id="rule-upper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg> حرف كبير وحرف صغير</li>
        <li id="rule-number"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg> رقم واحد على الأقل</li>
      </ul>

      <div class="field" id="confirmField">
        <label for="confirm">تأكيد كلمة المرور</label>
        <div class="input-wrap">
          <input type="password" id="confirm" placeholder="أعد إدخال كلمة المرور" autocomplete="new-password">
          <span class="toggle-pass" data-target="confirm" role="button" aria-label="تبديل إظهار كلمة المرور">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>
        <div class="error">كلمتا المرور غير متطابقتين.</div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" disabled>
        <span id="submitText">حفظ كلمة المرور</span>
      </button>
    </form>

    <a href="03-login.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>العودة إلى تسجيل الدخول</span>
    </a>
  </div>

  <!-- Success State View -->
  <div class="success-box" id="successBox">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <h2>تم تغيير كلمة المرور بنجاح</h2>
    <p>يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.</p>
    <button type="button" class="btn-primary" id="goLoginBtn">
      <span>الذهاب إلى تسجيل الدخول</span>
    </button>
  </div>

</div>

</body>
</html>
